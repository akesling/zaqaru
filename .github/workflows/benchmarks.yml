name: benchmark harness
on:
  pull_request:
    paths:
      - 'tools/microbench/**'
      - 'crates/cpu/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/microbench -p 'test_*.py'
      - run: bash -n tools/microbench/linux.sh tools/microbench/django-latency.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y lld
      - run: cargo run --release --locked -p zaqaru-cpu --example bytecode_bench -- 100000
      # A functional smoke test, not a timing gate on a shared runner.
      - run: python3 tools/microbench/measure.py --kernels mixed loads stores --repeats 2 --output benchmark-results/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmark-results/smoke.json
