# Hubris's app-g070 demo built for a Cortex-M7: the same STM32G070 and the
# same tasks, compiled for ARMv7E-M with the FPU, so that the kernel takes
# its ARMv7-M paths — configurable faults, the ARMv7 MPU, FP context on
# every switch — on peripherals the machine already has. It is how the M7
# core was first checked against a real kernel:
#
#   cp demo/hubris/app-g070-m7.toml <hubris>/app/demo-stm32g0-nucleo/
#   (cd <hubris> && cargo xtask dist app/demo-stm32g0-nucleo/app-g070-m7.toml)
#   zaqaru-m0 <hubris>/target/demo-stm32g070-m7/dist/default/final.bin \
#       --part stm32g070 --core m7
#
# "Ping!" on USART1, and task ping faulting on purpose — a null read, a
# divide by zero — and restarted by jefe, is it working. The stacks and the
# kernel's RAM are larger than app-g070's: an ARMv7-M exception frame with
# FP state is 104 bytes, and every task here carries one.
name = "demo-stm32g070-m7"
target = "thumbv7em-none-eabihf"
chip = "../../chips/stm32g0"
memory = "memory-g070.toml"
board = "stm32g070-nucleo"
stacksize = 944

[kernel]
name = "demo-stm32g0-nucleo"
requires = {flash = 24576, ram = 5120}
features = ["g070"]
stacksize = 640

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 1536}
start = true
stacksize = 512
notifications = ["fault", "timer"]

[tasks.sys]
name = "drv-stm32xx-sys"
features = ["g070", "no-ipc-counters"]
priority = 1
max-sizes = {flash = 2048, ram = 1024}
uses = ["rcc", "gpio", "system_flash"]
start = true
stacksize = 512
task-slots = ["jefe"]

[tasks.usart_driver]
name = "drv-stm32g0-usart"
features = ["g070", "no-ipc-counters"]
priority = 2
max-sizes = {flash = 4096, ram = 1024}
uses = ["usart1"]
start = true
notifications = ["usart-irq"]
interrupts = {"usart1.irq" = "usart-irq"}
task-slots = ["sys"]
stacksize = 512

[tasks.user_leds]
name = "drv-user-leds"
features = ["stm32g0", "no-ipc-counters"]
priority = 2
max-sizes = {flash = 2048, ram = 1024}
start = true
task-slots = ["sys"]
stacksize = 512
notifications = ["timer"]

[tasks.pong]
name = "task-pong"
features = ["no-ipc-counters"]
priority = 3
max-sizes = {flash = 1024, ram = 1024}
start = true
task-slots = ["user_leds"]
notifications = ["timer"]
stacksize = 512

[tasks.ping]
name = "task-ping"
features = ["uart", "no-ipc-counters"]
priority = 4
max-sizes = {flash = 8192, ram = 2048}
stacksize = 768
start = true
task-slots = [{peer = "pong"}, "usart_driver"]

[tasks.hiffy]
name = "task-hiffy"
features = ["no-ipc-counters"]
priority = 3
max-sizes = {flash = 8192, ram = 8192 }
start = true
notifications = ["timer"]

[tasks.idle]
name = "task-idle"
priority = 5
max-sizes = {flash = 128, ram = 1024}
stacksize = 512
start = true
