[package]
name = "zaqaru-armv6m"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "An M-profile machine: a Cortex-M0+ or Cortex-M7 interpreter and enough of an STM32G0 or STM32H753 to boot Hubris"

[lib]
name = "armv6m"

[[bin]]
name = "zaqaru-m0"
path = "src/bin/m0/main.rs"

[dependencies]
# For reading a Hubris archive (`zip`, `hubris`): one file out of a zip,
# and the symbols in its ELFs, demangled.
bzip2-rs = "0.1.2"
miniz_oxide = "0.8.9"
# IEEE 754 in software, for the FPU: every rounding mode and exception
# flag, and NaNs whose bits do not depend on the host.
rustc_apfloat = "0.2.3"
rustc-demangle = "0.1.24"
# For reading the DWARF in a Hubris archive's ELFs (`dwarf`): what source
# line an instruction is from, the types of statics, how to step a stack
# back a frame, where a frame's variables are. DWARF's line programs, call
# frame instructions and location expressions are each a small machine of
# their own; gimli is the reader the Rust toolchain itself uses, and
# addr2line its lookup of lines and inlined calls. Reading only, without
# the loader that would pull in `object` and memory maps.
gimli = { version = "0.33.0", default-features = false, features = ["read", "std", "endian-reader"] }
addr2line = { version = "0.26.1", default-features = false, features = ["std", "rustc-demangle"] }

[dev-dependencies]
# The ISA tests assemble their programs with clang and read the labels back
# out of the object's symbol table, rather than checking in hand-encoded
# halfwords nobody can read.
object = "0.40.0"
